# 自動テスト（開発設計書「テスト計画」）
# 外部 Action はタグではなくコミット SHA で固定する（版の完全固定）。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: ブラウザ側（lint・整形・テスト）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  python:
    name: 計算側・チェックツール
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install --require-hashes -r compute/requirements.txt -r compute/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: モジュール間の依存チェック
        run: python tools/check_module_deps.py
      - name: 材料データ・定数の出典チェック
        run: python tools/check_materials.py
      - name: 二重実装照合の期待値が最新か
        run: python tools/generate_crosscheck.py --check
